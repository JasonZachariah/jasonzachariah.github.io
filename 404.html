<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to jasonzachariah.ca</title>
  <link rel="canonical" href="https://jasonzachariah.ca/">
  <meta http-equiv="refresh" content="0; url=https://jasonzachariah.ca/">
  <script>
    (function () {
      var path = location.pathname
        .replace(/\/index\.html$/i, "/")
        .replace(/\.html$/i, "")
        .replace(/\/404$/i, "/");
      if (!path) path = "/";
      location.replace("https://jasonzachariah.ca" + path + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://jasonzachariah.ca/">jasonzachariah.ca</a>.</p>
</body>
</html>
